<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My-GPT — Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>My-GPT</h1>
        <p>BlenderBot 400M &middot; running locally</p>
      </div>
      <button id="reset" type="button" title="Clear conversation">Reset</button>
    </header>

    <main id="messages" role="log" aria-live="polite" aria-label="Conversation">
      <div class="row bot">
        <div class="avatar bot-avatar">AI</div>
        <div class="bubble">Hi! I'm a small open-source chatbot. Ask me something.</div>
      </div>
    </main>

    <form id="chat-form" autocomplete="off">
      <input type="text" id="prompt" aria-label="Your message" maxlength="2000" placeholder="Send a message..." required>
      <button type="submit" id="send">Send</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
